<!DOCTYPE html>
<html>
<head>
    <title>eEDM Lab Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 1400px; margin: auto; padding: 20px; }
        h1 { text-align: center; }
        .plot { height: 350px; margin-bottom: 20px; }
        #updated { text-align: center; color: #666; }
    </style>
</head>
<body>
    <h1>eEDM Lab Dashboard</h1>
    <p id="updated">Last updated: loading...</p>
    
    <div id="temp-humidity-plot" class="plot"></div>
    <div id="pressure-plot" class="plot"></div>
    <div id="ig-pressure-plot" class="plot"></div>
    <div id="mag-plot" class="plot"></div>
    <div id="gas-plot" class="plot"></div>
    
    <script>
        async function loadData() {
            const r = await fetch('data.json?' + Date.now());
            const data = await r.json();
            
            const t = data.map(d => d.time);
            document.getElementById('updated').textContent = 'Last updated: ' + t[t.length-1];
            
            Plotly.newPlot('temp-humidity-plot', [
                {x: t, y: data.map(d => d.temp), name: 'Temperature (C)', yaxis: 'y1'},
                {x: t, y: data.map(d => d.humidity), name: 'Humidity (%)', yaxis: 'y2'}
            ], {
                title: 'Temperature & Humidity',
                yaxis: {title: 'Temperature (C)'},
                yaxis2: {title: 'Humidity (%)', overlaying: 'y', side: 'right'}
            });
            
            Plotly.newPlot('pressure-plot', [
                {x: t, y: data.map(d => d.ambientPressure), name: 'Ambient Pressure'}
            ], {
                title: 'Ambient Pressure',
                yaxis: {title: 'hPa'}
            });
            
            Plotly.newPlot('ig-pressure-plot', [
                {x: t, y: data.map(d => d.igPressure), name: 'IG Pressure'}
            ], {
                title: 'Ion Gauge Pressure',
                yaxis: {title: 'Torr', type: 'log'}
            });
            
            Plotly.newPlot('mag-plot', [
                {x: t, y: data.map(d => d.magX), name: 'X'},
                {x: t, y: data.map(d => d.magY), name: 'Y'},
                {x: t, y: data.map(d => d.magZ), name: 'Z'},
                {x: t, y: data.map(d => Math.sqrt(d.magX*d.magX + d.magY*d.magY + d.magZ*d.magZ)), name: 'Magnitude'}
            ], {
                title: 'Magnetic Field',
                yaxis: {title: 'uT'}
            });
            
            Plotly.newPlot('gas-plot', [
                {x: t, y: data.map(d => d.gas), name: 'Gas Resistance'}
            ], {
                title: 'MOX Sensor Resistance (rough measure of VOCs, probably ignore this plot)',
                yaxis: {title: 'Ohms'}
            });
        }
        
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
