<!DOCTYPE html>
<html>
<head>
    <title>eEDM Lab Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 1400px; margin: auto; padding: 20px; }
        h1 { text-align: center; }
        .plot { height: 600px; margin-bottom: 20px; }
        #updated { text-align: center; color: #666; }
        #controls { text-align: center; margin-bottom: 20px; }
        #data-select { font-size: 16px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>eEDM Lab Dashboard</h1>
    <div id="controls">
        <label for="data-select">Data source: </label>
        <select id="data-select">
            <option value="data.json">Current</option>
        </select>
    </div>
    <p id="updated">Last updated: loading...</p>
    
    <div id="ig-pressure-plot" class="plot"></div>
    <div id="temp-humidity-plot" class="plot"></div>
    <div id="temp-humidity2-plot" class="plot"></div>
    <div id="pressure-plot" class="plot"></div>
    <div id="mag-plot" class="plot"></div>
    <div id="gas-plot" class="plot"></div>
    
    <script>
        // ===== CONFIG (edit these) =====
        const titleSize = 24;
        const axisLabelSize = 18;
        const tickSize = 14;
        const legendSize = 14;
        const REPO = 'josephmlev/eedmLabDashboard';
        // ================================

        const plotIds = ['temp-humidity2-plot', 'ig-pressure-plot', 'temp-humidity-plot', 'pressure-plot', 'mag-plot', 'gas-plot'];
        let syncing = false;

        const defaultLayout = {
            font: { size: tickSize },
            title: { font: { size: titleSize } },
            legend: { 
                font: { size: legendSize },
                x: 0.01,
                y: 0.99,
                xanchor: 'left',
                yanchor: 'top',
                bgcolor: 'rgba(255,255,255,0.8)'
            },
            xaxis: { titlefont: { size: axisLabelSize }, tickfont: { size: tickSize } },
            yaxis: { titlefont: { size: axisLabelSize }, tickfont: { size: tickSize } },
            yaxis2: { titlefont: { size: axisLabelSize }, tickfont: { size: tickSize } }
        };

        async function populateDropdown() {
            const select = document.getElementById('data-select');
            const r = await fetch(`https://api.github.com/repos/${REPO}/contents/backups`);
            const files = await r.json();
            
            files
                .filter(f => f.name.match(/^data_\d{4}-\d{2}-\d{2}\.json$/))
                .sort((a, b) => b.name.localeCompare(a.name))
                .forEach(f => {
                    const option = document.createElement('option');
                    option.value = 'backups/' + f.name;
                    option.textContent = f.name.replace('data_', '').replace('.json', '');
                    select.appendChild(option);
                });
        }

        function syncXAxes() {
            plotIds.forEach(id => {
                document.getElementById(id).on('plotly_relayout', function(eventData) {
                    if (syncing) return;
                    syncing = true;
                    
                    if (eventData['xaxis.range[0]'] && eventData['xaxis.range[1]']) {
                        plotIds.forEach(otherId => {
                            if (otherId !== id) {
                                Plotly.relayout(otherId, {
                                    'xaxis.range[0]': eventData['xaxis.range[0]'],
                                    'xaxis.range[1]': eventData['xaxis.range[1]']
                                });
                            }
                        });
                    }
                    if (eventData['xaxis.autorange']) {
                        plotIds.forEach(otherId => {
                            if (otherId !== id) {
                                Plotly.relayout(otherId, {'xaxis.autorange': true});
                            }
                        });
                    }
                    
                    setTimeout(() => { syncing = false; }, 100);
                });
            });
        }

        async function loadData(filename = 'data.json') {
            const r = await fetch(filename + '?' + Date.now());
            const data = await r.json();
            
            const t = data.map(d => d.time);
            document.getElementById('updated').textContent = 'Last updated: ' + t[t.length-1];

            Plotly.newPlot('temp-humidity2-plot', [
                {x: t, y: data.map(d => d.temp2), name: 'Temperature (C)', yaxis: 'y1'},
                {x: t, y: data.map(d => d.humidity2), name: 'Humidity (%)', yaxis: 'y2'}
            ], {
                ...defaultLayout,
                title: { text: 'Temperature & Humidity (Laser Table)', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'Temperature (C)' },
                yaxis2: { ...defaultLayout.yaxis2, title: 'Humidity (%)', overlaying: 'y', side: 'right' }
            });
            
            Plotly.newPlot('ig-pressure-plot', [
                {x: t, y: data.map(d => d.igPressure), name: 'IG Pressure'}
            ], {
                ...defaultLayout,
                title: { text: 'Ion Gauge Pressure', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'Torr', type: 'log', exponentformat: 'e' }
            });
            
            Plotly.newPlot('temp-humidity-plot', [
                {x: t, y: data.map(d => d.temp), name: 'Temperature (C)', yaxis: 'y1'},
                {x: t, y: data.map(d => d.humidity), name: 'Humidity (%)', yaxis: 'y2'}
            ], {
                ...defaultLayout,
                title: { text: 'Temperature & Humidity (MOT Stand)', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'Temperature (C)' },
                yaxis2: { ...defaultLayout.yaxis2, title: 'Humidity (%)', overlaying: 'y', side: 'right' }
            });

            Plotly.newPlot('mag-plot', [
                {x: t, y: data.map(d => d.magX), name: 'X'},
                {x: t, y: data.map(d => d.magY), name: 'Y'},
                {x: t, y: data.map(d => d.magZ), name: 'Z'},
                {x: t, y: data.map(d => Math.sqrt(d.magX*d.magX + d.magY*d.magY + d.magZ*d.magZ)), name: 'Magnitude'}
            ], {
                ...defaultLayout,
                title: { text: 'Magnetic Field (Twinleaf sensor. Currently in rack in random orientation)', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'uT' }
            });
            
            Plotly.newPlot('pressure-plot', [
                {x: t, y: data.map(d => d.ambientPressure), name: 'Ambient Pressure'}
            ], {
                ...defaultLayout,
                title: { text: 'Ambient Pressure', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'hPa' }
            });
            
            Plotly.newPlot('gas-plot', [
                {x: t, y: data.map(d => d.gas), name: 'Gas Resistance'}
            ], {
                ...defaultLayout,
                title: { text: 'MOX Sensor Resistance (rough measure of VOCs, probably ignore this plot)', font: { size: titleSize } },
                yaxis: { ...defaultLayout.yaxis, title: 'Ohms' }
            });

            syncXAxes();
        }

        document.getElementById('data-select').addEventListener('change', function() {
            loadData(this.value);
        });
        
        populateDropdown();
        loadData();
        setInterval(() => {
            if (document.getElementById('data-select').value === 'data.json') {
                loadData();
            }
        }, 60000);
    </script>
</body>
</html>
